[alembic]
script_location = scripts/migrations
file_template = %%(rev)s_%%(slug)s
# DO NOT set sqlalchemy.url here — env.py reads it from ALEMBIC_DATABASE_URL
# (preferred) or DATABASE_URL, so the DSN never lands in committed config.
# See docs/PRE_RELEASE_PAYMENT_CHECKLIST.md §9.5.B step 1.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
